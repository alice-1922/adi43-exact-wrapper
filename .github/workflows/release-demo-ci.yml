name: Release demo CI

on:
  push:
    paths:
      - "release-demo/**"
      - ".github/workflows/release-demo-ci.yml"
  pull_request:
    paths:
      - "release-demo/**"
      - ".github/workflows/release-demo-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest -v
